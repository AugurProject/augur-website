 assumptions →</text><text x="380" y="404" font-size="10.5" letter-spacing="1" fill="var(--cds-text-secondary)">OPEN WORK</text><text x="380" y="422" font-size="11.5" fill="var(--cds-text-primary)">Open-source code and</text><text x="380" y="438" font-size="11.5" fill="var(--cds-text-primary)">research in public.</text><text x="380" y="476" font-size="11.5" fill="var(--cds-text-secondary)">Repositories →</text><text x="550" y="404" font-size="10.5" letter-spacing="1" fill="var(--cds-text-secondary)">ZOLTAR</text><text x="550" y="422" font-size="11.5" fill="var(--cds-text-primary)">Oracle designs can share</text><text x="550" y="438" font-size="11.5" fill="var(--cds-text-primary)">REP if they handle</text><text x="550" y="454" font-size="11.5" fill="var(--cds-text-primary)">forking.</text><text x="550" y="476" font-size="11.5" fill="var(--cds-text-secondary)">Shared foundation →</text></g></svg>
