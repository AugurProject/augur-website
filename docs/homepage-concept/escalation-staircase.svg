<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 376" role="img" aria-label="Each challenge raises the stake until a round goes unanswered" font-size="13"><title>Each challenge raises the stake until a round goes unanswered</title><style>
:root{--cds-chart-axis:#6b7280;--cds-chart-grid:#d1d5db;--cds-chart-reference-tint:#eef1f6;--cds-chart-categorical-1:#15803d;--cds-text-primary:#111827;--cds-text-secondary:#4b5563}
@media (prefers-color-scheme:dark){:root{--cds-chart-axis:#9ca3af;--cds-chart-grid:#374151;--cds-chart-reference-tint:#12203a;--cds-chart-categorical-1:#4ade80;--cds-text-primary:#f3f4f6;--cds-text-secondary:#9ca3af}}
text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
</style><defs><marker id="st-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--cds-chart-categorical-1)"></path></marker><marker id="st-arrow-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--cds-chart-axis)"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="var(--cds-text-primary)">Each challenge raises the stake until a round goes unanswered</text><text x="24" y="48" font-size="11.5" fill="var(--cds-text-secondary)">Section 03 figure, conceptual. Green marks the expected path; the fork stays neutral.</text><line x1="32" y1="300" x2="728" y2="300" stroke="var(--cds-chart-axis)" stroke-width="1"></line><g><rect x="40" y="288" width="90" height="12" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="85" y="322" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--cds-text-primary)">01 Ask</text><text x="85" y="338" text-anchor="middle" font-size="10.5" fill="var(--cds-text-secondary)">question, criteria,</text><text x="85" y="352" text-anchor="middle" font-size="10.5" fill="var(--cds-text-secondary)">fee in REP</text></g><g><rect x="146" y="264" width="80" height="36" fill="var(--cds-chart-categorical-1)" fill-opacity="0.14" stroke="var(--cds-chart-categorical-1)" stroke-width="1.5"></rect><text x="186" y="322" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--cds-text-primary)">02 Report</text><text x="186" y="338" text-anchor="middle" font-size="10.5" fill="var(--cds-text-secondary)">answer backed</text><text x="186" y="352" text-anchor="middle" font-size="10.5" fill="var(--cds-text-secondary)">by a REP bond</text></g><g><rect x="242" y="240" width="60" height="60" fill="var(--cds-chart-categorical-1)" fill-opacity="0.14" stroke="var(--cds-chart-categorical-1)" stroke-width="1.5"></rect><rect x="314" y="212" width="60" height="88" fill="var(--cds-chart-categorical-1)" fill-opacity="0.14" stroke="var(--cds-chart-categorical-1)" stroke-width="1.5"></rect><rect x="386" y="180" width="60" height="120" fill="var(--cds-chart-categorical-1)" fill-opacity="0.14" stroke="var(--cds-chart-categorical-1)" stroke-width="1.5"></rect><text x="344" y="322" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--cds-text-primary)">03 Challenge rounds</text><text x="344" y="338" text-anchor="middle" font-size="10.5" fill="var(--cds-text-secondary)">each stakes more and</text><text x="344" y="352" text-anchor="middle" font-size="10.5" fill="var(--cds-text-secondary)">replaces the answer</text></g><g><line x1="230" y1="150" x2="460" y2="150" stroke="var(--cds-chart-axis)" stroke-width="1" stroke-dasharray="4 3"></line><text x="232" y="144" font-size="10.5" fill="var(--cds-text-secondary)">fork threshold</text></g><g><path d="M416 180V118H428" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25" stroke-dasharray="4 3" marker-end="url(#st-arrow-n)"></path><rect x="430" y="104" width="160" height="28" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25" stroke-dasharray="4 3"></rect><text x="510" y="122" text-anchor="middle" font-size="11.5" fill="var(--cds-text-primary)">Rare: last-resort fork</text><text x="436" y="92" font-size="10.5" fill="var(--cds-text-secondary)">holders move REP to the outcome they support</text></g><g><path d="M446 182H468" fill="none" stroke="var(--cds-chart-categorical-1)" stroke-width="2" marker-end="url(#st-arrow)"></path><rect x="470" y="168" width="100" height="28" fill="var(--cds-chart-categorical-1)" fill-opacity="0.14" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><text x="520" y="187" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">Final</text><text x="520" y="214" text-anchor="middle" font-size="10.5" fill="var(--cds-text-secondary)">a round goes</text><text x="520" y="228" text-anchor="middle" font-size="10.5" fill="var(--cds-text-secondary)">unchallenged</text></g><g><path d="M570 182H594" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25" marker-end="url(#st-arrow-n)"></path><rect x="596" y="168" width="124" height="28" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="658" y="187" text-anchor="middle" font-size="11.5" fill="var(--cds-text-primary)">Application acts</text><text x="658" y="214" text-anchor="middle" font-size="10.5" fill="var(--cds-text-secondary)">settles under its own</text><text x="658" y="228" text-anchor="middle" font-size="10.5" fill="var(--cds-text-secondary)">rules, including Invalid</text></g></svg>
