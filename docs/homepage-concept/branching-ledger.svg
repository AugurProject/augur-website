<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-label="Oracle designs share REP, and a fork gives every answer its own ledger" font-size="13"><title>Oracle designs share REP, and a fork gives every answer its own ledger</title><style>
:root{--cds-chart-axis:#6b7280;--cds-chart-grid:#d1d5db;--cds-chart-reference-tint:#eef1f6;--cds-chart-categorical-1:#15803d;--cds-text-primary:#111827;--cds-text-secondary:#4b5563}
@media (prefers-color-scheme:dark){:root{--cds-chart-axis:#9ca3af;--cds-chart-grid:#374151;--cds-chart-reference-tint:#12203a;--cds-chart-categorical-1:#4ade80;--cds-text-primary:#f3f4f6;--cds-text-secondary:#9ca3af}}
text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
</style><text x="24" y="30" font-size="15" font-weight="600" fill="var(--cds-text-primary)">Oracle designs share REP, and a fork gives every answer its own ledger</text><text x="24" y="48" font-size="11.5" fill="var(--cds-text-secondary)">Section 06 figure, conceptual. Zoltar picks no branch; every branch is drawn with equal weight.</text><g><text x="40" y="68" font-size="10.5" letter-spacing="1" fill="var(--cds-text-secondary)">ORACLE DESIGNS</text><rect x="40" y="76" width="80" height="28" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25" stroke-dasharray="none"></rect><rect x="136" y="76" width="80" height="28" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25" stroke-dasharray="none"></rect><rect x="232" y="76" width="80" height="28" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25" stroke-dasharray="4 3"></rect><text x="80" y="94" text-anchor="middle" font-size="11.5" fill="var(--cds-text-primary)">Design A</text><text x="176" y="94" text-anchor="middle" font-size="11.5" fill="var(--cds-text-primary)">Design B</text><text x="272" y="94" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--cds-text-primary)">Your design</text><g stroke="var(--cds-chart-axis)" stroke-width="1.25"><line x1="80" y1="104" x2="80" y2="170"></line><line x1="176" y1="104" x2="176" y2="170"></line><line x1="272" y1="104" x2="272" y2="170"></line></g><text x="280" y="142" font-size="10.5" fill="var(--cds-text-secondary)">share REP</text></g><g><line x1="40" y1="170" x2="360" y2="170" stroke="var(--cds-chart-axis)" stroke-width="1.5"></line><text x="40" y="192" font-size="11.5" font-weight="600" fill="var(--cds-text-primary)">Parent universe</text><text x="40" y="208" font-size="10.5" fill="var(--cds-text-secondary)">questions, markets and REP</text></g><g><rect x="355" y="165" width="10" height="10" fill="var(--cds-text-primary)"></rect><text x="352" y="194" text-anchor="end" font-size="11.5" font-weight="600" fill="var(--cds-text-primary)">Fork</text><text x="352" y="210" text-anchor="end" font-size="10.5" fill="var(--cds-text-secondary)">when disagreement persists</text></g><g fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.5"><path d="M365 170C420 170 440 90 500 90H596"></path><path d="M365 170H596"></path><path d="M365 170C420 170 440 250 500 250H596"></path></g><g><rect x="596" y="86" width="8" height="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.5"></rect><text x="614" y="94" font-weight="600" fill="var(--cds-text-primary)">Invalid</text><text x="614" y="110" font-size="10.5" fill="var(--cds-text-secondary)">own REP</text></g><g><rect x="596" y="166" width="8" height="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.5"></rect><text x="614" y="174" font-weight="600" fill="var(--cds-text-primary)">Yes</text><text x="614" y="190" font-size="10.5" fill="var(--cds-text-secondary)">own REP</text></g><g><rect x="596" y="246" width="8" height="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.5"></rect><text x="614" y="254" font-weight="600" fill="var(--cds-text-primary)">No</text><text x="614" y="270" font-size="10.5" fill="var(--cds-text-secondary)">own REP</text></g><g><text x="40" y="300" font-size="11.5" fill="var(--cds-text-primary)">Each child keeps its own REP. Zoltar never selects or deletes a branch.</text><text x="40" y="316" font-size="11.5" fill="var(--cds-text-secondary)">Designs that handle forking can continue in child universes; applications and users decide where.</text></g></svg>
